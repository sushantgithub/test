    :root { --bg:#0b1419; --text:#e8f1f5; --muted:#8aa3b3; --accent:#2aa889; --card:#1a2d38; --border:#2c4a5a; --bad:#e07a5f; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:"Segoe UI",Arial,sans-serif; background:var(--bg); color:var(--text); }
    .wrap { width:min(920px, calc(100% - 1.5rem)); margin:0 auto; padding:1.25rem 0 3rem; }
    h1 { margin:0 0 .4rem; font-size:1.45rem; }
    p { color:var(--muted); line-height:1.5; }
    .paste { width:100%; min-height:4.5rem; background:#0f1c24; color:var(--text); border:1px solid var(--border); border-radius:10px; padding:.7rem; font:inherit; }
    .btn { appearance:none; border:0; background:var(--accent); color:#06241c; font-weight:800; padding:.55rem 1rem; border-radius:10px; cursor:pointer; }
    .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(64px,1fr)); gap:.35rem; margin:1rem 0; }
    .cell { display:grid; gap:.2rem; justify-items:center; font-size:.75rem; color:var(--muted); }
    .cell input {
      width:100%; height:2.4rem; text-align:center; text-transform:uppercase; font-weight:800;
      background:#0f1c24; color:var(--text); border:1px solid var(--border); border-radius:8px;
    }
    .cell.ok input { border-color:var(--accent); }
    .cell.bad input { border-color:var(--bad); background:rgba(224,122,95,.12); }
    .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:.6rem; margin:1rem 0; }
    .stat { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:.85rem; }
    .stat b { display:block; font-size:1.4rem; }
    .miss { margin-top:1rem; }
    .miss div { padding:.45rem 0; border-bottom:1px solid var(--border); font-size:.92rem; }

</head>

    const grid = document.getElementById("grid");
    KEY.forEach((q) => {
      const cell = document.createElement("label");
      cell.className = "cell";
      cell.innerHTML = `<span>Q${q.id}</span><input maxlength="1" data-id="${q.id}" aria-label="Question ${q.id}" />`;
      grid.appendChild(cell);
    });
    const inputs = [...grid.querySelectorAll("input")];
    inputs.forEach((el, i) => {
      el.addEventListener("input", () => {
        el.value = el.value.replace(/[^a-dA-D]/g, "").toUpperCase();
        if (el.value && i < inputs.length - 1) inputs[i + 1].focus();
      });
    });
    document.getElementById("fill").addEventListener("click", () => {
      const letters = document.getElementById("paste").value.toUpperCase().replace(/[^ABCD]/g, "");
      inputs.forEach((el, i) => { el.value = letters[i] || ""; el.parentElement.className = "cell"; });
    });
    document.getElementById("score").addEventListener("click", () => {
      let correct = 0, wrong = 0, blank = 0;
      const missed = [];
      KEY.forEach((q, i) => {
        const val = inputs[i].value;
        const cell = inputs[i].parentElement;
        cell.className = "cell";
        if (!val) { blank += 1; return; }
        if (val === q.correct) { correct += 1; cell.classList.add("ok"); }
        else {
          wrong += 1;
          cell.classList.add("bad");
          missed.push(`Q${q.id}: you chose ${val}, correct is ${q.correct}. ${q.stem}…`);
        }
      });
      document.getElementById("stats").hidden = false;
      document.getElementById("correct").textContent = String(correct);
      document.getElementById("wrong").textContent = String(wrong);
      document.getElementById("blank").textContent = String(blank);
